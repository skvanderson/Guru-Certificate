<svg width="500" height="350" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="url(#examGradient)"/>
  
  <defs>
    <linearGradient id="examGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2F3F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Laptop/Computer -->
  <g transform="translate(100, 50)">
    <!-- Screen -->
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#232F3E"/>
    <rect x="10" y="10" width="180" height="100" rx="4" fill="#FFFFFF"/>
    
    <!-- Screen Content -->
    <rect x="20" y="20" width="160" height="15" rx="2" fill="#FF9900"/>
    <rect x="20" y="45" width="120" height="8" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="60" width="140" height="8" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="75" width="100" height="8" rx="1" fill="#E0E0E0"/>
    
    <!-- Question Options -->
    <circle cx="30" cy="95" r="3" fill="#FF9900"/>
    <rect x="40" y="92" width="60" height="6" rx="1" fill="#E0E0E0"/>
    
    <!-- Base -->
    <rect x="50" y="120" width="100" height="8" rx="4" fill="#37475A"/>
  </g>
  
  <!-- Certificate -->
  <g transform="translate(350, 80)">
    <rect width="120" height="80" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <rect x="10" y="10" width="100" height="60" rx="4" fill="#F8F8F8"/>
    
    <!-- Certificate Content -->
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#232F3E">AWS</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial" font-size="8" fill="#FF9900">CERTIFIED</text>
    <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#37475A">Cloud Practitioner</text>
    
    <!-- Seal -->
    <circle cx="60" cy="65" r="8" fill="#00A651"/>
    <path d="M55 65 L58 68 L65 60" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Timer -->
  <g transform="translate(50, 200)">
    <circle cx="30" cy="30" r="25" fill="#FF9900"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF">90</text>
    <text x="30" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFFFFF">min</text>
  </g>
  
  <!-- Progress Bar -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="200" height="20" rx="10" fill="#E0E0E0"/>
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#00A651"/>
    <text x="100" y="35" text-anchor="middle" font-family="Arial" font-size="10" fill="#37475A">60% Complete</text>
  </g>
  
  <!-- Floating Icons -->
  <g transform="translate(400, 200)">
    <circle cx="20" cy="20" r="15" fill="#FF9900" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">✓</text>
  </g>
  
  <g transform="translate(50, 280)">
    <circle cx="20" cy="20" r="15" fill="#00A651" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">📊</text>
  </g>
  
  <g transform="translate(400, 280)">
    <circle cx="20" cy="20" r="15" fill="#FF9900" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">🏆</text>
  </g>
</svg>

