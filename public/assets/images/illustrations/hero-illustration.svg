<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="url(#gradient)" rx="20"/>
  
  <!-- AWS Cloud Elements -->
  <!-- EC2 Instance -->
  <rect x="80" y="120" width="60" height="40" rx="8" fill="#FF9900" opacity="0.9"/>
  <text x="110" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">EC2</text>
  
  <!-- S3 Bucket -->
  <rect x="200" y="100" width="50" height="50" rx="8" fill="#3F48CC" opacity="0.9"/>
  <text x="225" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">S3</text>
  
  <!-- RDS Database -->
  <rect x="320" y="110" width="60" height="40" rx="8" fill="#232F3E" opacity="0.9"/>
  <text x="350" y="135" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">RDS</text>
  
  <!-- Lambda Function -->
  <rect x="450" y="120" width="50" height="40" rx="8" fill="#FF9900" opacity="0.9"/>
  <text x="475" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">λ</text>
  
  <!-- CloudFront -->
  <rect x="150" y="200" width="60" height="40" rx="8" fill="#FF9900" opacity="0.9"/>
  <text x="180" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CF</text>
  
  <!-- VPC -->
  <rect x="300" y="200" width="50" height="40" rx="8" fill="#3F48CC" opacity="0.9"/>
  <text x="325" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">VPC</text>
  
  <!-- IAM -->
  <rect x="420" y="200" width="50" height="40" rx="8" fill="#232F3E" opacity="0.9"/>
  <text x="445" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">IAM</text>
  
  <!-- Connection Lines -->
  <path d="M140 140 L190 125" stroke="#FF9900" stroke-width="2" opacity="0.6"/>
  <path d="M250 125 L310 130" stroke="#3F48CC" stroke-width="2" opacity="0.6"/>
  <path d="M380 130 L440 140" stroke="#232F3E" stroke-width="2" opacity="0.6"/>
  <path d="M180 160 L180 190" stroke="#FF9900" stroke-width="2" opacity="0.6"/>
  <path d="M325 160 L325 190" stroke="#3F48CC" stroke-width="2" opacity="0.6"/>
  <path d="M445 160 L445 190" stroke="#232F3E" stroke-width="2" opacity="0.6"/>
  
  <!-- Certificate Badge -->
  <rect x="250" y="280" width="100" height="60" rx="12" fill="#FF9900" opacity="0.9"/>
  <text x="300" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AWS</text>
  <text x="300" y="325" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">CERTIFIED</text>
  
  
  <!-- Progress Bar -->
  <rect x="100" y="350" width="400" height="20" rx="10" fill="#E5E5E5"/>
  <rect x="100" y="350" width="320" height="20" rx="10" fill="#FF9900"/>
  <text x="300" y="365" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">80%</text>
  
  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Guru Certificate</text>
  <text x="300" y="75" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">AWS Certification Platform</text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3F48CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#232F3E;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>