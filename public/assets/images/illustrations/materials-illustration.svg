<svg width="500" height="350" viewBox="0 0 500 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="url(#materialsGradient)"/>
  
  <defs>
    <linearGradient id="materialsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2F3F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Books Stack -->
  <g transform="translate(50, 100)">
    <!-- Book 1 -->
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#FF9900"/>
    <rect x="5" y="5" width="70" height="90" rx="2" fill="#FFFFFF"/>
    <rect x="10" y="15" width="60" height="3" rx="1" fill="#232F3E"/>
    <rect x="10" y="25" width="50" height="2" rx="1" fill="#37475A"/>
    <rect x="10" y="35" width="55" height="2" rx="1" fill="#37475A"/>
    <rect x="10" y="45" width="45" height="2" rx="1" fill="#37475A"/>
    <text x="40" y="70" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FF9900">AWS</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="6" fill="#232F3E">Guide</text>
    
    <!-- Book 2 -->
    <rect x="20" y="-10" width="80" height="100" rx="4" fill="#00A651"/>
    <rect x="25" y="-5" width="70" height="90" rx="2" fill="#FFFFFF"/>
    <rect x="30" y="5" width="60" height="3" rx="1" fill="#232F3E"/>
    <rect x="30" y="15" width="50" height="2" rx="1" fill="#37475A"/>
    <rect x="30" y="25" width="55" height="2" rx="1" fill="#37475A"/>
    <rect x="30" y="35" width="45" height="2" rx="1" fill="#37475A"/>
    <text x="60" y="60" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#00A651">Cloud</text>
    <text x="60" y="70" text-anchor="middle" font-family="Arial" font-size="6" fill="#232F3E">Architecture</text>
    
    <!-- Book 3 -->
    <rect x="40" y="-20" width="80" height="100" rx="4" fill="#232F3E"/>
    <rect x="45" y="-15" width="70" height="90" rx="2" fill="#FFFFFF"/>
    <rect x="50" y="-5" width="60" height="3" rx="1" fill="#232F3E"/>
    <rect x="50" y="5" width="50" height="2" rx="1" fill="#37475A"/>
    <rect x="50" y="15" width="55" height="2" rx="1" fill="#37475A"/>
    <rect x="50" y="25" width="45" height="2" rx="1" fill="#37475A"/>
    <text x="80" y="50" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#232F3E">Security</text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial" font-size="6" fill="#232F3E">Best Practices</text>
  </g>
  
  <!-- PDF Document -->
  <g transform="translate(300, 80)">
    <rect width="120" height="150" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <rect x="10" y="10" width="100" height="130" rx="4" fill="#F8F8F8"/>
    
    <!-- PDF Content -->
    <rect x="20" y="20" width="80" height="8" rx="2" fill="#FF9900"/>
    <rect x="20" y="35" width="60" height="4" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="45" width="70" height="4" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="55" width="50" height="4" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="65" width="75" height="4" rx="1" fill="#E0E0E0"/>
    <rect x="20" y="75" width="65" height="4" rx="1" fill="#E0E0E0"/>
    
    <!-- Download Icon -->
    <g transform="translate(50, 100)">
      <circle cx="20" cy="20" r="15" fill="#00A651"/>
      <path d="M15 20 L20 15 L25 20 M20 15 L20 25" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    </g>
    
    <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="#232F3E">Download PDF</text>
  </g>
  
  <!-- Floating Icons -->
  <g transform="translate(200, 50)">
    <circle cx="20" cy="20" r="15" fill="#FF9900" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">📚</text>
  </g>
  
  <g transform="translate(400, 250)">
    <circle cx="20" cy="20" r="15" fill="#00A651" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">📖</text>
  </g>
  
  <g transform="translate(100, 280)">
    <circle cx="20" cy="20" r="15" fill="#232F3E" opacity="0.8"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">📋</text>
  </g>
</svg>

